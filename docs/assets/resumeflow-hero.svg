<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">ResumeFlow — Pick up where you left off.</title>
  <desc id="description">An original illustration of a local checkpoint carrying a note and a next step from save to context. This is a workflow illustration, not an application screenshot.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c30"/>
    </linearGradient>
    <linearGradient id="wordmark" x2="1" y2="0">
      <stop stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#8cebd0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#4d9d98" stop-opacity=".16"/>
      <stop offset="1" stop-color="#4d9d98" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a7c0db" opacity=".11"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dy="14" stdDeviation="16" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="438" rx="28" fill="url(#background)" stroke="#2b3a50"/>
  <rect x="603" y="24" width="573" height="392" rx="24" fill="url(#dots)"/>
  <ellipse cx="943" cy="204" rx="311" ry="214" fill="url(#glow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="64" y="55" width="48" height="48" rx="14" fill="#6ee7b7"/>
    <g fill="#0b1220">
      <rect x="77" y="69" width="5" height="20" rx="2"/>
      <path d="M88 68 102 79 88 90Z"/>
    </g>
    <text x="127" y="84" fill="#acc0d6" font-size="13" font-weight="600" letter-spacing="2.8">RESUME YOUR FLOW</text>
    <text x="59" y="200" fill="url(#wordmark)" font-size="80" font-weight="750" letter-spacing="-4">ResumeFlow</text>
    <text x="64" y="248" fill="#e0e9f3" font-size="26" font-weight="400">Pick up where you left off.</text>
    <path d="M64 278H503" stroke="#304058"/>
    <text x="64" y="314" fill="#a5b8d0" font-size="18">A checkpoint for your next session.</text>
    <g font-size="12" font-weight="650" letter-spacing="1.1">
      <rect x="64" y="349" width="111" height="31" rx="8" fill="#18302d" stroke="#31594e"/>
      <text x="80" y="369" fill="#a7f3d0">CLI / CODEX</text>
      <rect x="186" y="349" width="143" height="31" rx="8" fill="#18263c" stroke="#31465f"/>
      <text x="201" y="369" fill="#bdd6f5">LOCAL STORAGE</text>
      <rect x="340" y="349" width="117" height="31" rx="8" fill="#24283f" stroke="#434865"/>
      <text x="356" y="369" fill="#c7c9ee">OPT-IN GIT</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="665" y="92" width="454" height="233" rx="18" fill="#101b2c" stroke="#3a526a"/>
      <path d="M666 141H1118" stroke="#2a3c52"/>
      <circle cx="690" cy="117" r="4" fill="#6ee7b7"/>
      <text x="704" y="122" fill="#d5e1ed" font-size="13" font-weight="600" letter-spacing="1.6">CHECKPOINT</text>
      <text x="1079" y="122" fill="#8297b0" font-size="13">01</text>
      <text x="691" y="175" fill="#849bb6" font-size="12" letter-spacing="1.3">NOTE</text>
      <text x="691" y="203" fill="#e6edf5" font-size="22" font-weight="550">CLI MVP complete.</text>
      <rect x="690" y="224" width="404" height="77" rx="10" fill="#1b3040"/>
      <text x="707" y="248" fill="#8cebd0" font-size="11" font-weight="650" letter-spacing="1.5">NEXT STEP</text>
      <text x="707" y="277" fill="#dbeaf4" font-size="19">Try it in your own project.</text>
    </g>
    <rect x="948" y="57" width="155" height="30" rx="15" fill="#17382f" stroke="#2e5c4c"/>
    <circle cx="966" cy="72" r="3.5" fill="#6ee7b7"/>
    <text x="978" y="77" fill="#a7f3d0" font-size="12" font-weight="550">saved locally</text>
    <g font-family="'SFMono-Regular', Consolas, monospace" font-size="18">
      <text x="689" y="381" fill="#a7f3d0">save</text>
      <path d="M752 375H943M936 369 944 375 936 381" fill="none" stroke="#629b9c" stroke-width="1.5"/>
      <text x="793" y="363" fill="#8297b0" font-size="11">next session</text>
      <text x="966" y="381" fill="#c7dffc">context</text>
    </g>
    <text x="690" y="409" fill="#7488a3" font-size="9" letter-spacing="1.8">WORKFLOW ILLUSTRATION</text>
  </g>
</svg>
